name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r backend/requirements.txt

      # Self-contained unit/mock tests -- no real database needed. These are
      # the required, blocking part of this job.
      - name: Unit tests (no database)
        run: >
          python -m unittest
          backend.tests.test_auth
          backend.tests.test_benchmark_metrics
          backend.tests.test_comparison
          backend.tests.test_corpus
          backend.tests.test_measure_morph_strength
          backend.tests.test_readiness
          backend.tests.test_uz_latin_v3
          -v

      # test_corpus_integration.py, test_migration_diagnostics.py and
      # test_review_regressions.py each spin up their own short-lived,
      # disposable PostgreSQL cluster via initdb/pg_ctl
      # (backend/tests/postgres_fixture.py) -- never a shared or external
      # database. apt-get install -y postgresql makes `initdb` findable
      # under /usr/lib/postgresql/<version>/bin. The actual root cause of an
      # earlier failure here (found once postgres_fixture.py stopped
      # discarding initdb/pg_ctl's own output): Debian's postgresql package
      # defaults unix_socket_directories to /var/run/postgresql, owned by a
      # system "postgres" account the unprivileged runner user cannot write
      # a socket lock file into ("could not create lock file
      # .../.s.PGSQL.<port>.lock: Permission denied") -- nothing to do with
      # TCP, which is all this fixture ever uses. Fixed in
      # postgres_fixture.py by starting postgres with
      # unix_socket_directories="".
      - name: Integration tests (own disposable PostgreSQL cluster)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql
          initdb_path="$(find /usr/lib/postgresql -maxdepth 4 -name initdb -print -quit)"
          if [ -z "$initdb_path" ]; then
            echo "::error::initdb not found under /usr/lib/postgresql after installing the postgresql package" >&2
            exit 1
          fi
          echo "$(dirname "$initdb_path")" >> "$GITHUB_PATH"
          export PATH="$(dirname "$initdb_path"):$PATH"
          python -m unittest backend.tests.test_corpus_integration backend.tests.test_migration_diagnostics backend.tests.test_review_regressions -v
